<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' x2='1' y1='0' y2='1'><stop offset='0' stop-color='%237c8cff'/><stop offset='1' stop-color='%2335d0c0'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23g)'/><circle cx='11' cy='12' r='3.2' fill='white'/><circle cx='21' cy='11' r='2.4' fill='white' opacity='.85'/><circle cx='17' cy='21' r='3.6' fill='white' opacity='.95'/></svg>">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div><div class="brand-name">Social</div><div class="brand-sub" id="version">аналіз інформаційного простору</div></div>
    </div>
    <button class="btn primary wide" id="newCaseBtn"><span class="i-plus"></span>Новий кейс</button>
    <div class="side-label">Кейси</div>
    <nav class="case-list" id="caseList"></nav>
    <div class="side-foot">
      <button class="ghost-btn" id="settingsBtn" title="Агенти й моделі"><span class="i-gear"></span>Агенти</button>
      <button class="ghost-btn icon" id="themeBtn" title="Тема"><span class="i-moon"></span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="ghost-btn icon only-mobile" id="menuBtn" aria-label="Меню"><span class="i-menu"></span></button>
      <div class="crumbs" id="crumbs"></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<dialog id="modal"><form method="dialog" class="modal-card" id="modalBody"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
