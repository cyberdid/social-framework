[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "social-framework"
dynamic = ["version"]
description = "Evidence-aware analysis of social conflicts and information incidents, driven by the coding agent and model of your choice"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "pyyaml>=6",
  "requests>=2.31",
  "markdown>=3.5",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "scipy>=1.11",
]

keywords = ["osint", "information-space", "fact-checking", "mcp", "claude", "codex", "gemini", "forecasting", "ukraine"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Sociology",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/cyberdid/social-framework"
Issues = "https://github.com/cyberdid/social-framework/issues"
Preprint = "https://doi.org/10.5281/zenodo.24101594"

[project.optional-dependencies]
youtube = ["yt-dlp>=2025.1.1"]
news = ["googlenewsdecoder>=0.1.7"]
figures = ["matplotlib>=3.8", "networkx>=3.2", "adjustText>=1.0"]
all = ["yt-dlp>=2025.1.1", "googlenewsdecoder>=0.1.7", "matplotlib>=3.8", "networkx>=3.2", "adjustText>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
social = "social.cli:main"

[tool.hatch.version]
path = "social/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["social"]

[tool.hatch.build.targets.sdist]
include = ["social", "README.md", "README.en.md", "LICENSE", "pyproject.toml"]
